  <style>
    @font-face { font-family:'Halyard'; src:url('../fonts/halyard-display-regular.ttf') format('truetype'); font-weight:400; font-display:swap; }

    @font-face { font-family:'DMSans'; src:url('../fonts/DMSans_18pt-SemiBold.ttf') format('truetype'); font-weight:600; font-display:swap; }

    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

    :root {
      --bg:#fafafa; --surface:#FFFCD9; --gold:#F7D54B; --gold-dark:#D4AF1A;
      --gold-light:rgba(247,213,75,.18); --text:#181818; --text-mid:#555248; --radius-pill:9999px;
    }

    body {
      font-family:'DMSans', system-ui, sans-serif;
      background:var(--bg); color:var(--text); min-height:100vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:3rem 1.25rem 4rem;
    }

    .logo { margin-bottom:2rem; display:block; text-align:center; }
    .logo img { height:90px; width:auto; }

    .card {
      width:100%; max-width:560px; background:var(--surface);
      border-radius:20px; padding:2.75rem 2.25rem 2.5rem; text-align:center;
      box-shadow: 0 2px 6px rgba(181,140,0,.08), 0 16px 48px rgba(181,140,0,.14);
    }

    .result-icon {
      width:82px; height:82px; background:rgba(247,213,75,.5); border-radius:50%;
      display:flex; align-items:center; justify-content:center; margin:0 auto 1.5rem;
    }

    .step-tag {
      display:inline-block; font-size:0.74rem; font-weight:600; letter-spacing:0.1em;
      text-transform:uppercase; color:var(--gold-dark); background:rgba(247,213,75,.32);
      padding:0.3rem 0.9rem; border-radius:var(--radius-pill); margin-bottom:1rem;
    }

    .step-title {
      font-family:'Halyard', system-ui, sans-serif; font-weight:400;
      font-size:clamp(1.6rem, 3.5vw, 2.1rem); line-height:1.22; color:var(--text);
      margin-bottom:0.4rem; text-wrap:balance;
    }

    p.msg {
      font-size:clamp(1rem, 1.8vw, 1.12rem); color:var(--text-mid); line-height:1.75;
      max-width:440px; margin:1.1rem auto 0; text-wrap:balance;
    }

    .btn {
      font-family:'DMSans', sans-serif; font-size:1.05rem; font-weight:600;
      border:none; border-radius:var(--radius-pill); cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center; gap:0.55rem;
      min-height:58px; width:100%; padding:1rem 2.2rem; margin-top:2rem;
      text-decoration:none; transition:all 0.2s ease;
      background:#25D366; color:#fff; box-shadow:0 5px 18px rgba(37,211,102,.4);
    }
    .btn:hover { background:#1ebe5a; box-shadow:0 7px 24px rgba(37,211,102,.5); transform:translateY(-1px); }
    .btn svg { width:22px; height:22px; }

    @media (max-width:600px) {
      body { padding:2.25rem 1rem 3.25rem; }
      .logo img { height:72px; }
      .card { padding:2rem 1.25rem 1.75rem; border-radius:16px; }
    }
